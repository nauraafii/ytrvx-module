enable-magisk-update = true # Set this to false to stop the Magisk app from checking for module updates.
parallel-jobs = 1
module-author = "Naufal"
# Morphe bundles use .mpp files; do not apply the ReVanced integrations rewrite.
remove-rv-integrations-checks = false
patches-source = "MorpheApp/morphe-patches"
patches-version = "v2.0.0"
cli-source = "MorpheApp/morphe-desktop"
cli-version = "v1.20.0"

[Music-Extended]
enabled = true
app-name = "Music"
rv-brand = "YTRVX"
build-mode = "both"
arch = "both"
version = "9.15.51"
uptodown-dlurl = "https://youtube-music.en.uptodown.com/android"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.apps.youtube.music"

[YouTube-Extended]
enabled = true
app-name = "YouTube"
rv-brand = "YTRVX"
build-mode = "both"
version = "21.30.216"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
