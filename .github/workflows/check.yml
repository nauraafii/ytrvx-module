name: Check builder
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Check Java runtime
        run: java --version
      - name: Check shell syntax
        run: |
          for script in build.sh utils.sh build-termux.sh scripts/check_downloads.sh; do
            bash -n "$script"
          done
      - name: Check release configuration
        run: python3 scripts/check_build.py
      - name: Test release checks
        run: python3 -m unittest discover -s scripts
      - name: Test download failures
        run: bash scripts/check_downloads.sh
